name: GENESIS Format Fix

on:
  workflow_dispatch:
  push:
    branches:
      - "genesis/builder-probe"

permissions:
  contents: write

concurrency:
  group: genesis-builder-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: genesis/builder-probe

      - name: Sync branch before formatting
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin genesis/builder-probe
          git rebase origin/genesis/builder-probe

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.20"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Apply Prettier formatting
        run: bunx prettier --write .

      - name: Commit formatting corrections
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "FORMAT_STATUS=ALREADY_CLEAN"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): apply Prettier formatting"

          git fetch origin genesis/builder-probe
          git rebase origin/genesis/builder-probe
          git push origin HEAD:genesis/builder-probe
