name: GENESIS Format Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - genesis/builder-probe

permissions:
  contents: write

concurrency:
  group: genesis-format-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest branch state
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.20"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Apply Prettier formatting
        run: bunx prettier --write .

      - name: Commit and push formatting corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "FORMAT_STATUS=ALREADY_CLEAN"
            exit 0
          fi

          git add -A
          git commit -m "chore(ci): apply Prettier formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
