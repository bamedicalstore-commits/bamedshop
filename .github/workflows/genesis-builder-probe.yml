name: GENESIS Builder Probe

on:
  workflow_dispatch:
  push:
    branches:
      - "genesis/builder-probe"

permissions:
  contents: read

concurrency:
  group: genesis-builder-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight-build:
    name: Preflight + Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify repository identity
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Ref: ${GITHUB_REF}"
          echo "SHA: ${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git status --short

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.20"

      - name: Environment manifest
        shell: bash
        run: |
          set -euo pipefail
          node --version
          bun --version
          git --version
          python --version

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bunx prettier --check .

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          PORT=4173
          bun run preview --host 127.0.0.1 --port "${PORT}" > /tmp/genesis-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "${SERVER_PID}" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:${PORT}/" >/dev/null; then
              break
            fi
            sleep 1
          done

          pages=(
            "/"
            "/catalogue"
            "/cart"
            "/checkout"
            "/account"
            "/search"
            "/compare"
            "/contact"
            "/faq"
          )

          for path in "${pages[@]}"; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}${path}")
            echo "${status} ${path}"
            test "${status}" -lt 500
          done

          echo "RUNTIME_SMOKE=PASS"

      - name: Builder artifact manifest
        shell: bash
        run: |
          set -euo pipefail

          if [ -d ".output" ]; then
            BUILD_ARTIFACT=".output"
          elif [ -d "dist" ]; then
            BUILD_ARTIFACT="dist"
          else
            echo "BUILD_FAIL: no build artifact (.output or dist)"
            exit 1
          fi

          echo "BUILD_STATUS=PASS"
          echo "COMMIT_SHA=${GITHUB_SHA}"
          echo "BUILD_ARTIFACT=${BUILD_ARTIFACT}"
          du -sh "${BUILD_ARTIFACT}"
