name: GENESIS Builder Probe

on:
  workflow_dispatch:
  push:
    branches:
      - "genesis/builder-probe"
      - "fix/genesis-runtime-compatibility-fallback"
      - "fix/security-env-hygiene"
      - "main"
      - "feat/catalog-activation-engine-v1"
      - "feat/catalog-supabase-activation-clean"

permissions:
  contents: read

concurrency:
  group: genesis-builder-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight-build:
    name: Preflight + Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify repository identity
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Ref: ${GITHUB_REF}"
          echo "SHA: ${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.20"
      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          echo "Install PASS"
      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          bunx prettier --check .
          echo "Prettier PASS"
      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          bun run lint
          echo "Lint PASS"
      - name: Catalog contract tests
        shell: bash
        run: |
          set -euo pipefail
          bun run test:catalog
          echo "Catalog tests PASS"
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          bun run build
          echo "Build PASS"
      - name: Runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          PORT=4173
          HOST=127.0.0.1
          LOG_FILE="/tmp/genesis-runtime.log"
          FALLBACK_LOG_FILE="/tmp/genesis-runtime-fallback.log"
          WRANGLER_VERSION="4.122.0"
          test -f ".output/server/index.mjs"
          test -f ".output/server/wrangler.json"
          npx --yes "wrangler@${WRANGLER_VERSION}" --version
          start_server() {
            local log_file="$1"
            shift
            npx --yes "wrangler@${WRANGLER_VERSION}" dev --config .output/server/wrangler.json --local --ip "${HOST}" --port "${PORT}" "$@" >"${log_file}" 2>&1 &
            SERVER_PID=$!
            echo "SERVER_PID=${SERVER_PID}"
          }
          wait_for_readiness() {
            for i in {1..30}; do
              if ! kill -0 "${SERVER_PID}" 2>/dev/null; then return 1; fi
              if curl -fsS --max-time 2 "http://${HOST}:${PORT}/" >/tmp/genesis-runtime-root.html 2>/tmp/genesis-runtime-curl.err; then
                echo "SERVER_READY after ${i}s"
                return 0
              fi
              sleep 1
            done
            return 1
          }
          trap 'kill "${SERVER_PID:-}" 2>/dev/null || true' EXIT
          start_server "${LOG_FILE}"
          if ! wait_for_readiness; then
            kill "${SERVER_PID}" 2>/dev/null || true
            wait "${SERVER_PID}" 2>/dev/null || true
            cat "${LOG_FILE}" || true
            SUPPORTED_DATE="$(sed -nE 's/.*newest date supported by this server binary is "([0-9]{4}-[0-9]{2}-[0-9]{2})".*/\1/p' "${LOG_FILE}" | tail -1)"
            if [ -z "${SUPPORTED_DATE}" ]; then exit 1; fi
            echo "RUNTIME_COMPATIBILITY_FALLBACK=PASS"
            echo "RUNTIME_COMPATIBILITY_FALLBACK_DATE=${SUPPORTED_DATE}"
            start_server "${FALLBACK_LOG_FILE}" --compatibility-date "${SUPPORTED_DATE}"
            if ! wait_for_readiness; then cat "${FALLBACK_LOG_FILE}" || true; exit 1; fi
          fi
          echo "SERVER_READY PASS"
          pages=("/" "/catalogue" "/cart" "/checkout" "/account" "/search" "/compare" "/contact" "/faq")
          failures=0
          for path in "${pages[@]}"; do
            status=$(curl -sS --max-time 10 -o /tmp/genesis-runtime-response.html -w '%{http_code}' "http://${HOST}:${PORT}${path}" || true)
            echo "${status} ${path}"
            if [ "${status}" -ge 500 ] || [ "${status}" = "000" ]; then failures=$((failures + 1)); fi
          done
          if [ "${failures}" -ne 0 ]; then echo "routes FAIL"; echo "RUNTIME_SMOKE=FAIL"; exit 1; fi
          echo "routes PASS"
          echo "RUNTIME_SMOKE=PASS"
      - name: Builder artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          if [ -d ".output" ]; then BUILD_ARTIFACT=".output"; elif [ -d "dist" ]; then BUILD_ARTIFACT="dist"; else exit 1; fi
          echo "BUILD_STATUS=PASS"
          echo "COMMIT_SHA=${GITHUB_SHA}"
          echo "BUILD_ARTIFACT=${BUILD_ARTIFACT}"
          du -sh "${BUILD_ARTIFACT}"
