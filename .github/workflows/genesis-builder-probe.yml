name: GENESIS Builder Probe

on:
  workflow_dispatch:
  push:
    branches:
      - "genesis/builder-probe"
      - "fix/genesis-runtime-compatibility-fallback"
      - "fix/security-env-hygiene"
      - "main"
      - "feat/catalog-activation-engine-v1"
      - "feat/catalog-supabase-activation-v1"

permissions:
  contents: read

concurrency:
  group: genesis-builder-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight-build:
    name: Preflight + Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify repository identity
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Ref: ${GITHUB_REF}"
          echo "SHA: ${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git status --short

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.20"

      - name: Environment manifest
        shell: bash
        run: |
          set -euo pipefail
          node --version
          bun --version
          git --version
          python --version

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          echo "Install PASS"

      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          bunx prettier --check .
          echo "Prettier PASS"

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          bun run lint
          echo "Lint PASS"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          bun run build
          echo "Build PASS"

      - name: Runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          PORT=4173
          HOST=127.0.0.1
          LOG_FILE="/tmp/genesis-runtime.log"
          FALLBACK_LOG_FILE="/tmp/genesis-runtime-fallback.log"
          WRANGLER_VERSION="4.122.0"

          test -f ".output/server/index.mjs" || {
            echo "RUNTIME_START_FAIL: .output/server/index.mjs is missing"
            find .output -maxdepth 3 -type f -print | sort | head -200 || true
            exit 1
          }

          test -f ".output/server/wrangler.json" || {
            echo "RUNTIME_START_FAIL: generated Cloudflare Wrangler config is missing"
            find .output/server -maxdepth 2 -type f -print | sort | head -200 || true
            exit 1
          }

          echo "Starting the Cloudflare-module production artifact with Wrangler workerd"
          echo "WRANGLER_VERSION=${WRANGLER_VERSION}"
          npx --yes "wrangler@${WRANGLER_VERSION}" --version

          start_server() {
            local log_file="$1"
            shift
            npx --yes "wrangler@${WRANGLER_VERSION}" dev \
              --config .output/server/wrangler.json \
              --local \
              --ip "${HOST}" \
              --port "${PORT}" \
              "$@" \
              >"${log_file}" 2>&1 &
            SERVER_PID=$!
            echo "SERVER_PID=${SERVER_PID}"
          }

          wait_for_readiness() {
            for i in {1..30}; do
              if ! kill -0 "${SERVER_PID}" 2>/dev/null; then
                echo "SERVER_EXITED"
                return 1
              fi
              if curl -fsS --max-time 2 "http://${HOST}:${PORT}/" >/tmp/genesis-runtime-root.html 2>/tmp/genesis-runtime-curl.err; then
                echo "SERVER_READY after ${i}s"
                return 0
              fi
              sleep 1
            done
            echo "SERVER_NOT_READY"
            return 1
          }

          trap 'kill "${SERVER_PID:-}" 2>/dev/null || true' EXIT

          start_server "${LOG_FILE}"

          if ! wait_for_readiness; then
            kill "${SERVER_PID}" 2>/dev/null || true
            wait "${SERVER_PID}" 2>/dev/null || true

            echo "--- runtime log (first attempt) ---"
            cat "${LOG_FILE}" || true

            SUPPORTED_DATE="$(sed -nE 's/.*newest date supported by this server binary is "([0-9]{4}-[0-9]{2}-[0-9]{2})".*/\1/p' "${LOG_FILE}" | tail -1)"

            if [ -z "${SUPPORTED_DATE}" ]; then
              echo "RUNTIME_START_FAIL: Wrangler/Workerd failed without the explicit compatibility-date mismatch"
              echo "--- curl diagnostic ---"
              cat /tmp/genesis-runtime-curl.err || true
              exit 1
            fi

            echo "RUNTIME_COMPATIBILITY_FALLBACK=PASS"
            echo "RUNTIME_COMPATIBILITY_FALLBACK_DATE=${SUPPORTED_DATE}"
            echo "Retrying the local smoke test with the newest compatibility date supported by this bundled workerd."

            start_server "${FALLBACK_LOG_FILE}" --compatibility-date "${SUPPORTED_DATE}"

            if ! wait_for_readiness; then
              kill "${SERVER_PID}" 2>/dev/null || true
              wait "${SERVER_PID}" 2>/dev/null || true
              echo "RUNTIME_START_FAIL: Cloudflare runtime did not become HTTP-ready even with supported compatibility date ${SUPPORTED_DATE}"
              echo "--- runtime log (fallback) ---"
              cat "${FALLBACK_LOG_FILE}" || true
              echo "--- curl diagnostic ---"
              cat /tmp/genesis-runtime-curl.err || true
              exit 1
            fi
          fi

          echo "SERVER_READY PASS"

          pages=(
            "/"
            "/catalogue"
            "/cart"
            "/checkout"
            "/account"
            "/search"
            "/compare"
            "/contact"
            "/faq"
          )

          failures=0
          for path in "${pages[@]}"; do
            status=$(curl -sS --max-time 10 -o /tmp/genesis-runtime-response.html -w '%{http_code}' "http://${HOST}:${PORT}${path}" || true)
            echo "${status} ${path}"
            if [ "${status}" -ge 500 ] || [ "${status}" = "000" ]; then
              failures=$((failures + 1))
            fi
          done

          if [ "${failures}" -ne 0 ]; then
            echo "routes FAIL (${failures} route failures)"
            echo "RUNTIME_SMOKE=FAIL (${failures} route failures)"
            echo "--- runtime log ---"
            if [ -s "${FALLBACK_LOG_FILE}" ]; then
              cat "${FALLBACK_LOG_FILE}" || true
            else
              cat "${LOG_FILE}" || true
            fi
            exit 1
          fi

          echo "routes PASS"
          echo "RUNTIME_SMOKE=PASS"

      - name: Builder artifact manifest
        shell: bash
        run: |
          set -euo pipefail

          if [ -d ".output" ]; then
            BUILD_ARTIFACT=".output"
          elif [ -d "dist" ]; then
            BUILD_ARTIFACT="dist"
          else
            echo "BUILD_FAIL: no build artifact (.output or dist)"
            exit 1
          fi

          echo "BUILD_STATUS=PASS"
          echo "COMMIT_SHA=${GITHUB_SHA}"
          echo "BUILD_ARTIFACT=${BUILD_ARTIFACT}"
          du -sh "${BUILD_ARTIFACT}"
