name: GENESIS Builder Probe

on:
  workflow_dispatch:
  push:
    branches:
      - "genesis/builder-probe"

permissions:
  contents: write

concurrency:
  group: genesis-builder-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight-build:
    name: Preflight + Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify repository identity
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Ref: ${GITHUB_REF}"
          echo "SHA: ${GITHUB_SHA}"
          git rev-parse HEAD
          git status --short

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Environment manifest
        shell: bash
        run: |
          set -euo pipefail
          node --version
          bun --version
          git --version
          python --version

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Format source files
        shell: bash
        run: |
          set -euo pipefail
          bunx prettier --write "src/**/*.{ts,tsx}"

      - name: Commit formatting corrections to probe branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"

          if git diff --quiet -- src; then
            echo "FORMAT_STATUS=UNCHANGED"
            exit 0
          fi

          git add src
          git commit -m "chore(ci): apply Prettier formatting to source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "FORMAT_STATUS=COMMITTED"

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Builder artifact manifest
        shell: bash
        run: |
          set -euo pipefail

          if [ -d ".output" ]; then
            BUILD_ARTIFACT=".output"
          elif [ -d "dist" ]; then
            BUILD_ARTIFACT="dist"
          else
            echo "BUILD_FAIL: no build artifact (.output or dist)"
            exit 1
          fi

          echo "BUILD_STATUS=PASS"
          echo "COMMIT_SHA=${GITHUB_SHA}"
          echo "BUILD_ARTIFACT=${BUILD_ARTIFACT}"
          du -sh "${BUILD_ARTIFACT}"
