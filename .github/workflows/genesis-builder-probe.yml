name: GENESIS Builder Probe

on:
  workflow_dispatch:
  push:
    branches:
      - "genesis/builder-probe"

permissions:
  contents: read

concurrency:
  group: genesis-builder-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight-build:
    name: Preflight + Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify repository identity
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Ref: ${GITHUB_REF}"
          echo "SHA: ${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git status --short

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.20"

      - name: Environment manifest
        shell: bash
        run: |
          set -euo pipefail
          node --version
          bun --version
          git --version
          python --version

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bunx prettier --check .

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          PORT=4173
          HOST=127.0.0.1
          LOG_FILE="/tmp/genesis-runtime.log"

          test -f ".output/server/index.mjs" || {
            echo "RUNTIME_START_FAIL: .output/server/index.mjs is missing"
            find .output -maxdepth 3 -type f -print | sort | head -200 || true
            exit 1
          }

          test -f ".output/server/wrangler.json" || {
            echo "RUNTIME_START_FAIL: generated Cloudflare Wrangler config is missing"
            find .output/server -maxdepth 2 -type f -print | sort | head -200 || true
            exit 1
          }

          echo "Starting the Cloudflare-module production artifact with Wrangler workerd"
          npx --yes wrangler@4.114.0 dev \
            --config .output/server/wrangler.json \
            --local \
            --ip "${HOST}" \
            --port "${PORT}" \
            >"${LOG_FILE}" 2>&1 &
          SERVER_PID=$!
          trap 'kill "${SERVER_PID}" 2>/dev/null || true' EXIT

          echo "SERVER_PID=${SERVER_PID}"

          ready=0
          for i in {1..30}; do
            if ! kill -0 "${SERVER_PID}" 2>/dev/null; then
              echo "RUNTIME_START_FAIL: Wrangler/Workerd exited before becoming ready"
              echo "--- runtime log ---"
              cat "${LOG_FILE}" || true
              exit 1
            fi

              cat "${LOG_FILE}" || true
              exit 1
            fi
            if curl -fsS --max-time 2 "http://${HOST}:${PORT}/" >/tmp/genesis-runtime-root.html 2>/tmp/genesis-runtime-curl.err; then
              ready=1
              echo "SERVER_READY after ${i}s"
              break
            fi
            sleep 1
          done

          if [ "${ready}" -ne 1 ]; then
            echo "RUNTIME_START_FAIL: Cloudflare runtime did not become HTTP-ready on ${HOST}:${PORT}"
            echo "--- runtime log ---"
            cat "${LOG_FILE}" || true
            echo "--- curl diagnostic ---"
            cat "${LOG_FILE}" || true
            cat /tmp/genesis-runtime-curl.err || true
            exit 1
          fi

          pages=(
            "/"
            "/catalogue"
            "/cart"
            "/checkout"
            "/account"
            "/search"
            "/compare"
            "/contact"
            "/faq"
          )

          failures=0
          for path in "${pages[@]}"; do
            status=$(curl -sS --max-time 10 -o /tmp/genesis-runtime-response.html -w '%{http_code}' "http://${HOST}:${PORT}${path}" || true)
            echo "${status} ${path}"
            if [ "${status}" -ge 500 ] || [ "${status}" = "000" ]; then
              failures=$((failures + 1))
            fi
          done

          if [ "${failures}" -ne 0 ]; then
            echo "RUNTIME_SMOKE=FAIL (${failures} route failures)"
            echo "--- runtime log ---"
            cat "${LOG_FILE}" || true
            exit 1
          fi

          echo "RUNTIME_SMOKE=PASS"

      - name: Builder artifact manifest
        shell: bash
        run: |
          set -euo pipefail

          if [ -d ".output" ]; then
            BUILD_ARTIFACT=".output"
          elif [ -d "dist" ]; then
            BUILD_ARTIFACT="dist"
          else
            echo "BUILD_FAIL: no build artifact (.output or dist)"
            exit 1
          fi

          echo "BUILD_STATUS=PASS"
          echo "COMMIT_SHA=${GITHUB_SHA}"
          echo "BUILD_ARTIFACT=${BUILD_ARTIFACT}"
          du -sh "${BUILD_ARTIFACT}"
