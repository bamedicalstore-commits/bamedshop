name: Supabase Staging Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  staging-supabase:
    name: Supabase staging migration + security smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_REF: rkaziatuqxsedcusxgaq
      SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
      SUPABASE_STAGING_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
      SUPABASE_DB_POOLER_HOST: aws-0-eu-west-1.pooler.supabase.com
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5

      - name: Resolve staging database connection
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_STAGING_DB_URL:-}" ]; then
            echo "SUPABASE_CONNECTION_SOURCE=STAGING_DB_URL"
            echo "SUPABASE_DB_URL_RUNTIME=${SUPABASE_STAGING_DB_URL}" >> "$GITHUB_ENV"
          elif [ -n "${SUPABASE_STAGING_DB_PASSWORD:-}" ]; then
            echo "SUPABASE_CONNECTION_SOURCE=STAGING_POOLER"
            python - <<'PY' >> "$GITHUB_ENV"
          import os
          from urllib.parse import quote
          password = quote(os.environ["SUPABASE_STAGING_DB_PASSWORD"], safe="")
          project_ref = os.environ["SUPABASE_PROJECT_REF"]
          host = os.environ["SUPABASE_DB_POOLER_HOST"]
          print(f"SUPABASE_DB_URL_RUNTIME=postgresql://postgres.{project_ref}:{password}@{host}:5432/postgres?sslmode=require")
          PY
          else
            echo "SUPABASE_STAGING_DB=BLOCKED"
            echo "Missing SUPABASE_STAGING_DB_URL or SUPABASE_STAGING_DB_PASSWORD GitHub secret."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest --version

      - name: Preview pending migrations on staging
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest db push --db-url "$SUPABASE_DB_URL_RUNTIME" --dry-run

      - name: Apply pending migrations to staging
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest db push --db-url "$SUPABASE_DB_URL_RUNTIME" --include-all
          echo "SUPABASE_STAGING_MIGRATIONS=PASS"

      - name: Validate staging migration history
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest migration list --db-url "$SUPABASE_DB_URL_RUNTIME"

      - name: Database lint
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest db lint --db-url "$SUPABASE_DB_URL_RUNTIME" --fail-on error
          echo "SUPABASE_STAGING_DB_LINT=PASS"

      - name: Generate live staging database types
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest gen types --db-url "$SUPABASE_DB_URL_RUNTIME" --lang typescript > /tmp/database-staging.ts
          grep -q "catalog_activation_status" /tmp/database-staging.ts
          grep -q "catalog_activation_reason" /tmp/database-staging.ts
          grep -q "catalog_activation_events" /tmp/database-staging.ts
          echo "SUPABASE_STAGING_LIVE_TYPES=PASS"

      - name: Verify activation boundary and catalogue projection
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest db query --db-url "$SUPABASE_DB_URL_RUNTIME" <<'SQL'
          select
            to_regclass('public.products') is not null as products_exists,
            to_regclass('public.catalog_activation_events') is not null as activation_events_exists,
            to_regprocedure('public.evaluate_catalog_activation(uuid)') is not null as evaluate_rpc_exists,
            to_regprocedure('public.activate_catalog_product(uuid)') is not null as activate_rpc_exists,
            to_regprocedure('public.deactivate_catalog_product(uuid,public.catalog_activation_reason)') is not null as deactivate_rpc_exists,
            to_regclass('public.retail_catalog') is not null as retail_projection_exists,
            coalesce((
              select c.relrowsecurity
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname = 'public'
                and c.relname = 'catalog_activation_events'
            ), false) as activation_events_rls_enabled,
            (
              select count(*)
              from public.products
              where technical_specs->>'catalog_status' = 'source_import_unpriced'
            ) as supplier_seed_products;
          SQL
          echo "SUPABASE_STAGING_BOUNDARY=PASS"

      - name: Final staging evidence marker
        shell: bash
        run: |
          set -euo pipefail
          echo "SUPABASE_PROJECT_REF=${SUPABASE_PROJECT_REF}"
          echo "SUPABASE_STAGING_DB=PASS"
          echo "SUPABASE_STAGING_MIGRATIONS=PASS"
          echo "SUPABASE_STAGING_DB_LINT=PASS"
          echo "SUPABASE_STAGING_LIVE_TYPES=PASS"
          echo "SUPABASE_STAGING_BOUNDARY=PASS"
