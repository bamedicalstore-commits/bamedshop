name: Prettier Export

on:
  push:
    branches:
      - fix/prettier-current-main

jobs:
  format-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write docs/catalogue/authoritative-seed.md src/integrations/supabase/types.ts src/lib/cart.server.ts
      - name: Export formatted files to log
        run: |
          set -euo pipefail
          for f in docs/catalogue/authoritative-seed.md src/integrations/supabase/types.ts src/lib/cart.server.ts; do
            echo "===== FILE:$f ====="
            cat "$f"
            echo "===== END:$f ====="
          done
