name: Prettier Export

on:
  push:
    branches:
      - fix/prettier-current-main

permissions:
  contents: write

jobs:
  format-export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write docs/catalogue/authoritative-seed.md src/integrations/supabase/types.ts src/lib/cart.server.ts
      - name: Commit formatted files
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/catalogue/authoritative-seed.md src/integrations/supabase/types.ts src/lib/cart.server.ts; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/catalogue/authoritative-seed.md src/integrations/supabase/types.ts src/lib/cart.server.ts
          git commit -m "style: format catalog and cart files"
          git push origin HEAD:fix/prettier-current-main
