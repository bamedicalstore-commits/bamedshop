name: Temporary Auth Prettier Formatter

on:
  push:
    branches:
      - fix/auth-password-recovery-flow

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prettier@3.7.3 --write src/routes/auth.tsx src/routes/auth.reset-password.tsx

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git add src/routes/auth.tsx src/routes/auth.reset-password.tsx
          git commit -m "style(auth): apply canonical Prettier formatting"
          git push
