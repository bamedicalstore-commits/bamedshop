name: Temporary Auth Prettier
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.20"
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/routes/auth.tsx src/routes/auth.reset-password.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/auth.tsx src/routes/auth.reset-password.tsx
          git diff --cached --quiet && exit 0
          git commit -m "style(auth): apply repository Prettier formatting"
          git push origin HEAD:fix/auth-password-recovery-flow
