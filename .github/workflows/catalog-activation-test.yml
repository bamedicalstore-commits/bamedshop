name: Catalog Activation Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  activation-gate:
    name: Retail activation domain gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.20"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run activation gate tests
        run: bun run test:catalog

      - name: Activation gate PASS
        run: echo "CATALOG_ACTIVATION_GATE=PASS"
